<a [routerLink]="['/agenda', story.slug ]" routerLinkActive="active">
    <div class="app-event-list-item">
        <img 
            [src]="story.content.images.length ? (story.content.images[0] | storyBlokImage : 200 : 80) : '/full-logo-BK.png'" 
            [alt]="story.content.images.length ? story.content.images[0].alt : 'Logo of Bergharen Klassiek'" 
            loading="lazy"
        />
        <div class="app-event-list-item__text">
            <span>{{ story.content.date | appDate : 'year' }}</span>
            <strong class="app-event-list-item__text__title">{{ story.content.title }}</strong>
        </div>
    </div>
</a>
