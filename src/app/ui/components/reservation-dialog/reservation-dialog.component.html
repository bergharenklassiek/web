<h2 mat-dialog-title>Reserveer</h2>
<mat-dialog-content>
    @if (selectedEvent(); as event) {
        @if (!openedForEvent) {
            <button type="button" class="reservation-dialog__back-button" (click)="selectedEvent.set(undefined)">‹ Alle concerten</button>
        }
        <app-reservation-form [event]="event" />
    }
    @else if (events()) {
        @for (story of events()!; track story.id) {
            <app-reservation-dialog-row [story]="story" (selected)="select(story)" />
        }
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <div class="reservation-dialog__close-button" matButton [mat-dialog-close]="true" cdkFocusInitial>Sluiten</div>
</mat-dialog-actions>
