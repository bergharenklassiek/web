<div class="app-header">
    <button type="button" class="app-header__menu-button" aria-label="Menu openen" [attr.aria-expanded]="menuOpen()" (click)="onClickMenuIcon()">
        <app-icon [icon]="menuIcon" size="lg" />
    </button>
    <div class="app-header__title">
        <a routerLink="/" routerLinkActive="active" aria-label="Bergharen Klassiek, naar de homepagina">
            <img src="/full-logo-BK.png" alt="Logo van Bergharen Klassiek" width="230" height="46">
        </a>
    </div>
    <div class="app-header__menu" [class.app-header__menu--open]="menuOpen()" [class.app-header__menu--closed]="!menuOpen()">
        <button type="button" class="app-header__menu__close-button" aria-label="Menu sluiten" (click)="onClose()">
            <app-icon [icon]="closeIcon" size="xl" />
        </button>
        <div class="app-header__menu__content">
            @for (option of ['Home', 'Agenda', 'Over ons', 'Gebouw', 'Concerten in de regio', 'ANBI', 'Contact']; track option) {
                <a 
                    routerLink="/{{ option === 'Home' ? '' : option.toLowerCase().replaceAll(' ', '-') }}" 
                    routerLinkActive="active" 
                    (click)="onClose()"
                >
                    {{ option }}
                </a>
            }
        </div>
    </div>
</div>
