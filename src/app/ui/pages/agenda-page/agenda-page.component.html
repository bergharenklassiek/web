<div class="app-agenda-page">
    @let showPast = showPastEvents$ | async;
    <div class="app-agenda-page__buttons">
        <div
            class="app-agenda-page__toggle"
            [class.app-agenda-page__toggle--past]="showPast === true"
            [class.app-agenda-page__toggle--upcoming]="showPast === false"
            role="group"
            aria-label="Concerten"
        >
            <span class="app-agenda-page__toggle__indicator" aria-hidden="true"></span>
            <button
                type="button"
                class="app-agenda-page__toggle__button"
                [class.app-agenda-page__toggle__button--checked]="showPast === true"
                [attr.aria-pressed]="showPast === true"
                (click)="onClick(true)"
            >Concert historie</button>
            <button
                type="button"
                class="app-agenda-page__toggle__button"
                [class.app-agenda-page__toggle__button--checked]="showPast === false"
                [attr.aria-pressed]="showPast === false"
                (click)="onClick(false)"
            >Aankomende concerten</button>
        </div>
    </div>
    @if (events$ | async; as events) {
        @if (events.length === 0 && (showPastEvents$ | async) === false) {
            We zijn op dit moment druk bezig met ons programma, hou de website in de gaten!
        } 
        @else {
            @for (story of events; track $index) {
                <app-event-list-item class="app-agenda-page__item" [story]="story"></app-event-list-item>
            }
        }
    }
</div>
