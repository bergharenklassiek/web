[build]
    command = "ng build"
    publish = "dist/bergharen_klassiek/browser"

# Angular 22 needs Node ^22.22.3, ^24.15.0 or >=26
[build.environment]
    NODE_VERSION = "24"

[[redirects]]
    from = "/robots.txt"
    to = "/robots.txt"
    status = 200

[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200
