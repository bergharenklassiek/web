[build]
    command = "ng build"
    publish = "dist/bergharen_klassiek/browser"

# Angular 22 needs Node ^22.22.3, ^24.15.0 or >=26
[build.environment]
    NODE_VERSION = "24"

[[redirects]]
    from = "/robots.txt"
    to = "/robots.txt"
    status = 200

[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

# For static files. Server-rendered responses get the same headers from src/app/core/config/security-headers.ts, which
# explains the policy. A test keeps the two the same.
[[headers]]
    for = "/*"
    [headers.values]
        Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://a.storyblok.com https://a2.storyblok.com https://i.ytimg.com; font-src 'self'; connect-src 'self' https://api.storyblok.com https://script.google.com https://script.googleusercontent.com; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
        X-Content-Type-Options = "nosniff"
        X-Frame-Options = "DENY"
        Referrer-Policy = "strict-origin-when-cross-origin"
        Permissions-Policy = "camera=(), microphone=(), geolocation=()"
